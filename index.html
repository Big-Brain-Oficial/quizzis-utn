<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizzes UTN</title>
<meta name="description" content="Bancos de preguntas de repaso para materias de ISI (UTN FRRe), con corrección inmediata.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="img/favicon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{var t=localStorage.getItem("quiz-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="engine/quiz.css">
</head>
<body>
<div class="wrap">
  <div class="topbar end" id="topbar"></div>
  <h1 class="brand"><span class="utn-mark" aria-hidden="true"></span>Quizzes UTN</h1>
  <p class="sub">Bancos de preguntas de repaso con corrección inmediata. Elegí una materia y después el parcial; tu progreso queda guardado en este navegador.</p>
  <p class="sub">Si encontrás un error o querés proponer algún cambio, podés abrir un <a href="https://github.com/Big-Brain-Oficial/quizzis-utn/issues" target="_blank" rel="noopener noreferrer">issue</a> o un <a href="https://github.com/Big-Brain-Oficial/quizzis-utn/pulls" target="_blank" rel="noopener noreferrer">PR</a> en el repositorio.</p>
  <ul class="subjects" id="subjects" aria-live="polite"><li class="card empty-state">Cargando materias…</li></ul>
</div>
<script type="module">
import { esc, topActions, initTheme, backToTop } from "./engine/quiz.js";
import { loadSubject, isReady, plural } from "./engine/subject.js";

document.getElementById("topbar").innerHTML = topActions();
initTheme();
backToTop();

const list = document.getElementById("subjects");

try {
  const res = await fetch("subjects/subjects.json");
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const slugs = await res.json();
  const cards = await Promise.all(slugs.map(async (slug) => {
    try {
      const s = await loadSubject(new URL(`subjects/${slug}/`, document.baseURI));
      const exams = s.exams.map((e) => isReady(e)
        ? `${esc(e.name)} (${plural(e.data.questions.length, "pregunta", "preguntas")})`
        : `${esc(e.name)} (próximamente)`);
      return `<li><a class="subject" href="subjects/${esc(slug)}/" style="--sa:${esc(s.accent)}">
        <h2>${esc(s.name)}</h2>
        ${s.description ? `<p>${esc(s.description)}</p>` : ""}
        <p class="counts">${exams.join(" · ")}</p>
      </a></li>`;
    } catch (e) {
      return `<li class="card empty-state">No se pudo cargar «${esc(slug)}» (${esc(e.message)}).</li>`;
    }
  }));
  list.innerHTML = cards.join("");
} catch (e) {
  list.innerHTML = `<li class="card empty-state">No se pudo cargar la lista de materias (${esc(e.message)}).
    Si abriste el archivo directamente, levantá un servidor local: <code>npx serve .</code></li>`;
}
</script>
</body>
</html>
